<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AIU: Amp It Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/pwa/manifest.json">
<meta name="theme-color" content="#0B0F1A">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIU">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0F1A;--panel:#141B30;--panel2:#1B2440;--line:rgba(255,255,255,.09);--paper:#EDEFF5;--white:#fff;
--volt:#5B8CFF;--volt2:#8FB0FF;--lime:#19E6B4;--blaze:#FF7A3D;--stone:#9AA3B5;--txt:#E8EBF3;--danger:#FF6B6B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--txt);font:500 15px/1.55 'Inter',system-ui,sans-serif;display:flex}
.side{width:248px;background:#0D1322;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;flex:none}
.logo{font:800 32px/1.05 'Inter',system-ui,sans-serif;padding:4px 10px 16px;color:#fff}
.logo i{font-style:normal;color:var(--volt2)}
.nav{background:none;border:0;color:var(--stone);text-align:left;padding:10px 14px;border-radius:12px;font:600 15px 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.nav.on{color:#fff;background:rgba(91,140,255,.16)}
.side .foot{margin-top:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--stone);border:1px solid var(--line)}
main{flex:1;overflow:auto;padding:26px;min-width:0;max-width:1080px;margin:0 auto;width:100%}
h1{font:800 clamp(34px,5vw,54px)/1.05 'Inter',system-ui,sans-serif;margin:0 0 6px;color:#fff;letter-spacing:-.03em}
h1 i{font-style:normal;color:var(--volt2)}
h2{color:#fff;margin:0 0 10px;letter-spacing:-.02em}
.sub{color:var(--stone);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--stone);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--volt);outline-offset:1px}
.btn{border:1px solid var(--volt);background:var(--volt);color:#fff;border-radius:999px;padding:10px 20px;font:600 14px 'Inter',sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--txt);border-color:var(--line)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#06231B}
.btn.danger{background:none;border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mono{font-family:'JetBrains Mono',monospace}
.stat{font:800 46px/1 'Inter',system-ui,sans-serif;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
pre{white-space:pre-wrap;background:#0D1322;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 'JetBrains Mono',monospace;margin:8px 0;color:var(--txt);overflow:auto}
/* chat */
#chatlog{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.msg{max-width:860px;padding:12px 16px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--volt);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;border:1px dashed var(--line);color:var(--stone);font-size:13px}
.msg pre{margin:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 16px;font:600 13px 'Inter',sans-serif;cursor:pointer}
.chip:hover{border-color:var(--volt)}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--ink);padding:10px 0}
.composer textarea{flex:1;resize:none;max-height:140px}
#artifact{margin-bottom:14px}
#artifact iframe{width:100%;height:480px;border:1px solid var(--line);border-radius:10px;background:#fff}
.atabs{display:flex;gap:6px;margin:10px 0}
.atabs button{border:1px solid var(--line);background:none;color:var(--stone);border-radius:999px;padding:5px 14px;font:600 13px 'Inter';cursor:pointer}
.atabs button.on{background:var(--volt);border-color:var(--volt);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:6px}
.dot.off{background:var(--stone)}
a{color:var(--volt2)}
.fade>*{animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){.fade>*{animation:none}}
@media(max-width:800px){body{flex-direction:column}.side{width:100%;flex-direction:row;overflow-x:auto;padding:10px;align-items:center}.logo{padding:0 10px;font-size:24px}.nav{white-space:nowrap;padding:8px 12px}.side .foot .pill,.side .foot #pwaBtn{display:none}.side .foot{display:flex;flex-direction:row;padding:0}main{padding:16px}.composer{position:static}}
</style></head><body>
<nav class="side" id="side"></nav><main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(n||0).toLocaleString();
const usd=c=>'$'+(c/100).toFixed(2);
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))}}
function cp(t){try{navigator.clipboard.writeText(t);toast('Copied')}catch(e){prompt('Copy:',t)}}
function toast(t){const d=document.createElement('div');d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B2440;border:1px solid rgba(255,255,255,.15);color:#E8EBF3;padding:10px 20px;border-radius:999px;font-size:14px;z-index:99';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

let view='assist', isAdmin=false, planLabel='basic', signedIn=false;
let msgs=[], chatId=null, convos=[];
let artifact=null; // {name, code}
let limits={plan:'basic',limit:20,used:0};
const dshort=t=>{try{return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}catch(e){return''}};

const NAV=[['assist','Assistant'],['funnels','Funnels & Leads'],['videos','Videos'],['studio','Studio'],['aff','Affiliates'],['bill','Billing']];
function renderSide(){
  $('#side').innerHTML='<div class="logo">AI<i>U</i></div>'+
    NAV.concat(isAdmin?[['admin','Admin']]:[]).map(n=>`<button class="nav ${n[0]==view?'on':''}" onclick="setView('${n[0]}')">${n[1]}${n[0]=='funnels'&&newLeadCount()>0?` <span class="pill" style="border-color:var(--lime);color:var(--lime)">${newLeadCount()} new</span>`:''}</button>`).join('')+
    `<div class="foot"><span class="pill">${limits.limit<0?'AI: unlimited':`AI: ${limits.used}/${limits.limit} today`}</span><button class="nav" id="pwaBtn" style="display:none;border:1px solid var(--lime);color:var(--lime)" onclick="pwaInstall()">Install app</button><button class="nav" onclick="out()">Sign out</button></div>`;
  showPwaBtn();
}
function setView(v){view=v;artifactTab='preview';if(v=='assist'){loadConvos()}render()}
async function out(){await api('/api/auth/sign-out',{});try{localStorage.removeItem('aiu_chat')}catch(e){}location.href='/'}
/* Keep the current chat across tab switches and app backgrounding: remember chatId for 30 min. */
const CHAT_GRACE_MS=30*60*1000;
function saveChatState(){try{if(chatId)localStorage.setItem('aiu_chat',JSON.stringify({chatId,at:Date.now()}));else localStorage.removeItem('aiu_chat')}catch(e){}}
function restoreChatState(){try{const s=JSON.parse(localStorage.getItem('aiu_chat')||'null');if(s&&s.chatId&&Date.now()-s.at<CHAT_GRACE_MS){openConvo(s.chatId)}}catch(e){}}
setInterval(saveChatState,15000);
window.addEventListener('pagehide',saveChatState);

/* ---------- chat ---------- */
const CHIPS=['Build me a funnel for roofers','Show my new leads','Build a landing page for my business','What is my plan?'];
function fmtBody(t){
  // code fences -> <pre>, then line breaks
  const parts=String(t).split(/```(\w*)\n?([\s\S]*?)```/g);
  let h='';
  for(let i=0;i<parts.length;i+=3){
    h+=esc(parts[i]).replace(/\n/g,'<br>');
    if(i+2<parts.length) h+=`<pre>${esc(parts[i+2])}</pre>`;
  }
  return h;
}
function welcomeHtml(){
  if(convos.length) return '<div class="msg sys">Say hello — try one of the suggestions above.</div>';
  return `<div class="msg ai"><b>Hey — I'm your AIU assistant, your right hand in here.</b><br><br>Tell me what you want in plain words and I'll get it done: a <b>lead funnel</b> that captures customers, a <b>website or app</b> for your business — or ask me anything about your plan, leads, and referrals.<br><br>Flip on <b>Agent mode</b> above if you want to watch me work through something step by step. Tap a suggestion to see what I can do.</div>`;
}
function vAssist(){
  return `<div class="fade"><h1>Your AI <i>assistant</i></h1>
  <p class="sub">Chat, build funnels that generate leads, create websites and apps, manage leads — all in one place. Ask for anything.</p>
  <div class="row" style="margin-bottom:12px">
    <button class="btn ${assistMode=='chat'?'lime':'ghost'}" onclick="setAssistMode('chat')">Chat</button>
    <button class="btn ${assistMode=='agent'?'lime':'ghost'}" onclick="setAssistMode('agent')">Agent mode</button>
    ${assistMode=='chat'?`<button class="btn ghost" onclick="newChat()">+ New chat</button>
    <select id="convosel" onchange="openConvo(this.value)" style="flex:1;min-width:160px;max-width:440px"><option value="">Past conversations…</option>${convos.map(c=>`<option value="${c.id}"${c.id==chatId?' selected':''}>${esc(c.title)} · ${esc(dshort(c.updatedAt))}</option>`).join('')}</select>
    ${chatId?`<button class="btn danger" onclick="delConvo()">Delete</button>`:''}`:''}
  </div>
  ${assistMode=='chat'?`
  <div class="chips">${CHIPS.map(c=>`<button class="chip" onclick="sendChat('${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('')}</div>
  <div id="chatlog">${msgs.map(m=>`<div class="msg ${m.role=='user'?'user':'ai'}">${fmtBody(m.content)}</div>`).join('')||welcomeHtml()}</div>
  <div id="artifact"></div>
  <div class="composer"><textarea id="cin" rows="2" placeholder="Ask anything, or tell me what to build..." onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea><button class="btn" id="csend" onclick="sendChat()">Send</button></div>
  `:`
  <div class="card" style="border-color:var(--lime)">
    <b>Agent mode</b>
    <p style="color:var(--stone);font-size:14px;margin:6px 0 12px">Give the agent a goal and watch it work through it step by step — like watching an assistant check things off a list. Try: "Build a funnel for my roofing business and publish it" or "Check my new leads and claim the best one".</p>
    <div class="composer"><textarea id="agentIn" rows="2" placeholder="What should the agent get done?"></textarea><button class="btn lime" id="agentGo" onclick="runAgent()">Run</button></div>
  </div>
  <div id="agentSteps" style="display:grid;gap:8px;margin-top:12px"></div>
  <div id="agentDone"></div>
  `}
  </div>`;
}
let assistMode='chat';
function setAssistMode(m){assistMode=m;render()}
/* ---------- Agent mode: watch the AI work step by step ---------- */
let agentRunning=false;
async function runAgent(){
  if(agentRunning)return;
  const goal=(document.getElementById('agentIn')?.value||'').trim();
  if(!goal){toast('Tell the agent what to get done.');return}
  agentRunning=true;
  const stepsEl=document.getElementById('agentSteps'),doneEl=document.getElementById('agentDone');
  stepsEl.innerHTML='';doneEl.innerHTML='';
  document.getElementById('agentGo').textContent='Working…';
  const addStep=(text,state)=>{
    const d=document.createElement('div');
    d.className='card';d.style.cssText='padding:10px 14px;display:flex;gap:10px;align-items:center';
    d.innerHTML=`<span style="font-size:18px">${state=='done'?'✅':state=='work'?'⏳':'▫️'}</span><span>${esc(text)}</span>`;
    stepsEl.appendChild(d);return d;
  };
  let cur=null;
  try{
    const r=await fetch('/api/assistant/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal})});
    if(r.status===429){const j=await r.json().catch(()=>({}));showUpgrade(j);throw new Error(j.error||'Daily AI limit reached.')}
    if(!r.ok)throw new Error('Agent request failed.');
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    const flush=()=>{
      let i;while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        for(const line of chunk.split('\n')){
          if(!line.startsWith('data:'))continue;
          try{
            const e=JSON.parse(line.slice(5));
            if(e.type=='step'){if(cur)cur.querySelector('span:first-child').textContent='✅';cur=addStep(e.text,'work')}
            else if(e.type=='tool'){cur=addStep(e.text,'work')}
            else if(e.type=='tool_done'){if(cur)cur.querySelector('span:first-child').textContent='✅'}
            else if(e.type=='done'){if(cur)cur.querySelector('span:first-child').textContent='✅';lastAgentGoal=goal;doneEl.innerHTML=`<div class="card" style="border-color:var(--lime);margin-top:12px"><b>Done</b><p style="white-space:pre-wrap">${esc(e.text)}</p>${isAdmin?'<button class="btn ghost" onclick="copyPaxHandoff()">Copy handoff for Pax</button>':''}</div>`}
            else if(e.type=='error'){toast(e.text)}
          }catch{}
        }
      }
    };
    while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});flush()}
    flush();
  }catch(err){if(err.message!=='Agent request failed.'&&!String(err.message).includes('Daily'))toast(err.message||'Agent failed.')}
  agentRunning=false;const g=document.getElementById('agentGo');if(g)g.textContent='Run';
}
function copyPaxHandoff(){
  const steps=[...document.querySelectorAll('#agentSteps .card span:last-child')].map(s=>s.textContent.trim());
  const done=document.querySelector('#agentDone p')?.textContent.trim()||'';
  const txt=`AIU Agent handoff\nGoal: ${lastAgentGoal}\nSteps:\n${steps.map(s=>'- '+s).join('\n')}\nResult:\n${done}`;
  navigator.clipboard.writeText(txt).then(()=>toast('Handoff copied — paste it to Pax in chat.')).catch(()=>toast('Copy failed.'));
}
let lastAgentGoal='';
let artifactTab='preview';
function renderArtifact(){
  const el=$('#artifact'); if(!el) return;
  if(!artifact){el.innerHTML='';return}
  el.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(artifact.name)}</b>
    <div class="row"><button class="btn ghost" onclick="dlArtifact()">Download .html</button><button class="btn ghost" onclick="cp(artifact.code)">Copy code</button><button class="btn danger" onclick="artifact=null;renderArtifact()">Close</button></div></div>
    <div class="atabs"><button class="${artifactTab=='preview'?'on':''}" onclick="artifactTab='preview';renderArtifact()">Preview</button><button class="${artifactTab=='code'?'on':''}" onclick="artifactTab='code';renderArtifact()">Code</button></div>
    ${artifactTab=='preview'?`<iframe id="pv" title="Preview" sandbox="allow-scripts"></iframe>`:`<pre>${esc(artifact.code.slice(0,60000))}</pre>`}
    <p class="sub" style="margin:8px 0 0">Want changes? Just say so — e.g. "make the header dark blue" — and I'll rebuild it.</p></div>`;
  const pv=$('#pv'); if(pv) pv.srcdoc=artifact.code;
}
function dlArtifact(){if(!artifact)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([artifact.code],{type:'text/html'}));a.download=(artifact.name||'project').toLowerCase().replace(/\W+/g,'-').slice(0,60)+'.html';a.click()}
function stripArtifact(t){return String(t).replace(/```html-artifact\s*\n[\s\S]*?```/g,'').trim()}
async function sendChat(prefill){
  const inp=$('#cin'); const text=(prefill||(inp?inp.value:'')).trim(); if(!text) return;
  if(inp) inp.value='';
  msgs.push({role:'user',content:text}); render();
  const log=$('#chatlog'); log.insertAdjacentHTML('beforeend','<div class="msg ai" id="thinking">Thinking…</div>'); log.scrollTop=log.scrollHeight;
  $('#csend').disabled=true;
  const r=await api('/api/assistant/chat',{message:text,conversationId:chatId,artifact});
  $('#thinking')?.remove(); $('#csend').disabled=false;
  if(r.status==402){msgs.push({role:'assistant',content:'Your subscription is not active.'});showUpgrade(null,'inactive');}
  else if(r.status==429&&r.data.limitHit){msgs.push({role:'assistant',content:r.data.error||'Daily limit reached.'});showUpgrade(r.data.plan,r.data.limit);}
  else if(!r.ok){msgs.push({role:'assistant',content:r.data.error||'Something went wrong. Try again.'});}
  else{
    chatId=r.data.conversationId||chatId;
    saveChatState();
    let reply=String(r.data.reply||'');
    const m=reply.match(/```html-artifact\s*\n([\s\S]*?)```/);
    if(m){artifact={name:text.slice(0,48)||'project',code:m[1].trim()};reply=stripArtifact(reply)||'Done — your project is ready in the preview panel below.';}
    msgs.push({role:'assistant',content:reply});
    loadConvos();
  }
  render();
  const l2=$('#chatlog'); if(l2) l2.scrollTop=l2.scrollHeight;
  const lim=await api('/api/assistant/limits'); if(lim.ok){limits=lim.data;renderSide()}
}
function newChat(){chatId=null;msgs=[];artifact=null;saveChatState();render()}
async function loadConvos(){
  const r=await api('/api/assistant/conversations');
  convos=r.ok?r.data:[];
  const s=$('#convosel');
  if(s&&view=='assist')s.innerHTML='<option value="">Past conversations…</option>'+convos.map(c=>`<option value="${c.id}"${c.id==chatId?' selected':''}>${esc(c.title)} · ${esc(dshort(c.updatedAt))}</option>`).join('');
}
async function openConvo(id){
  if(!id)return;
  const r=await api('/api/assistant/conversations/'+id);
  if(!r.ok){toast('Could not open that conversation');loadConvos();return}
  chatId=r.data.id; artifact=null; saveChatState();
  msgs=(r.data.messages||[]).map(m=>({role:m.role,content:m.content}));
  for(let i=msgs.length-1;i>=0;i--){
    if(msgs[i].role=='assistant'){
      const m=String(msgs[i].content).match(/```html-artifact\s*\n([\s\S]*?)```/);
      if(m){artifact={name:r.data.title||'project',code:m[1].trim()};msgs[i].content=stripArtifact(msgs[i].content)||'Done — your project is ready in the preview panel below.';break}
    }
  }
  render();
}
async function delConvo(){
  if(!chatId||!confirm('Delete this conversation?'))return;
  await fetch('/api/assistant/conversations/'+chatId,{method:'DELETE'});
  chatId=null;msgs=[];artifact=null;saveChatState();loadConvos();render();
}

/* ---------- funnels & leads ---------- */
let F=[],FL=[],PR=[];
/* New-lead tracking: badge on the nav + toast the moment leads arrive. */
let lastLeadSeen=0; try{lastLeadSeen=Number(localStorage.getItem('aiu_lastLead')||0)}catch(e){}
function newLeadCount(){return lastLeadSeen>0?FL.filter(l=>l.id>lastLeadSeen).length:0}
let funFirst=true;
async function funLoad(){
  const fr=await api('/api/funnels'); F=fr.ok?fr.data:[];
  const lr=await api('/api/funnel-leads'); FL=lr.ok?lr.data:[];
  const pr=await api('/api/prospects'); PR=pr.ok?pr.data:[];
  const mx=FL.reduce((m,l)=>Math.max(m,l.id),0);
  const fresh=newLeadCount();
  if(view=='funnels'){
    lastLeadSeen=mx; try{localStorage.setItem('aiu_lastLead',String(mx))}catch(e){}
    if(fresh>0)toast(`You have ${fresh} new lead${fresh>1?'s':''} — nice work.`);
    if(fresh>0||funFirst){funFirst=false;render()}
  } else if(fresh>0||lastLeadSeen==0){
    renderSide();
  }
}
setInterval(()=>{if(signedIn)funLoad()},30000);
function vFunnels(){
  return `<div class="fade"><h1>Funnels <i>& leads</i></h1>
  <p class="sub">Ask the assistant to build a funnel, or manage everything below. Claiming a lead moves it to your Pipeline and removes it from the available pool.</p>
  <div class="card"><b>My funnels</b>
  ${F.map(f=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--line);justify-content:space-between"><div><b>${esc(f.title)}</b> <span class="pill"><span class="dot ${f.status=='live'?'':'off'}"></span>${esc(f.status)}</span><div style="color:var(--stone);font-size:13px">${esc(f.industry)} · ${f.views||0} views · ${f.leads||0} leads${(f.views||0)>0?` · ${f.conversion||0}% opt-in`:''} · <span class="mono">${esc(f.url)}</span></div></div>
  <div class="row"><button class="btn ghost" onclick="window.open('${esc(f.url)}','_blank','noopener')">Open</button><button class="btn ghost" onclick="cp('${esc(f.url)}')">Copy link</button>${f.status=='live'?`<button class="btn ghost" onclick="pubFunnel(${f.id},'draft')">Unpublish</button>`:`<button class="btn" onclick="pubFunnel(${f.id},'live')">Publish</button>`}<button class="btn danger" onclick="delFunnel(${f.id})">Delete</button></div></div>`).join('')||'<p style="color:var(--stone)">No funnels yet — ask the assistant to build one.</p>'}</div>
  <div class="card"><b>Available leads <span class="pill">${FL.length}</span></b>

    <div class="card"><b>Upgrade signals — users who hit their AI limit</b><div style="color:var(--stone);font-size:13px;margin-bottom:4px">${hits.length} total — these users are ready to upgrade.</div>${hits.slice(0,30).map(h=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line);justify-content:space-between"><span class="mono" style="font-size:12px">${esc(h.userId.slice(0,8))}</span><span class="pill">${esc(h.plan)}</span><span class="mono" style="font-size:12px;color:var(--stone)">${new Date(h.createdAt).toLocaleString()}</span></div>`).join('')||'<p style="color:var(--stone)">None yet.</p>'}</div>`;
  }catch(e){const d=el();if(d)d.innerHTML=`<div class="card"><b>Couldn't load admin data</b><p style="color:var(--stone)">${esc(e.message||'Owner access only.')}</p><div class="row" style="margin-top:10px"><button class="btn lime" onclick="admLoad()">Try again</button></div></div>`}
}
async function admSet(id,status){await fetch('/api/admin/leads/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});admLoad()}
async function refPay(id){await fetch('/api/admin/referrals/'+id+'/pay',{method:'POST'});admLoad()}
async function affStatus(id,status){await fetch('/api/admin/affiliates/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});admLoad()}
async function affElite(id,elite){await fetch('/api/admin/affiliates/'+id+'/elite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({elite})});admLoad()}
async function subRefund(userId){
  if(!confirm('Refund this subscriber\'s most recent payment? This sends money back via Stripe.'))return;
  const r=await(await fetch('/api/admin/subscribers/'+encodeURIComponent(userId)+'/refund',{method:'POST'})).json();
  toast(r.ok?`Refunded ${(r.amount/100).toFixed(2)} ${r.currency.toUpperCase()}`:(r.error||'Refund failed'));admLoad();
}
async function subCharge(userId){
  const amt=prompt('Amount to charge (USD, e.g. 29.00):');
  if(!amt)return;
  const cents=Math.round(parseFloat(amt)*100);
  if(!cents||cents<50){toast('Enter an amount of at least $0.50.');return}
  const desc=prompt('Description (optional):')||'Manual charge';
  if(!confirm(`Charge $${(cents/100).toFixed(2)} to this subscriber's card on file?`))return;
  const r=await(await fetch('/api/admin/subscribers/'+encodeURIComponent(userId)+'/charge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amountCents:cents,description:desc})})).json();
  toast(r.ok?`Charged $${(cents/100).toFixed(2)} (${r.status})`:(r.error||'Charge failed'));admLoad();
}
async function ideaStatus(id,status){await fetch('/api/admin/ideas/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});admLoad()}

/* ---------- boot ---------- */
function render(){
  renderSide();
  $('#main').innerHTML=({assist:vAssist,funnels:vFunnels,videos:vVideos,studio:vStudio,aff:vAff,bill:vBill,admin:vAdmin})[view]();
  if(view=='assist'){renderArtifact();const l=$('#chatlog');if(l)l.scrollTop=l.scrollHeight}
  if(view=='funnels')funLoad();
  if(view=='videos')vidLoad();
  if(view=='studio')studioLoad();
  if(view=='aff')affLoad();
  if(view=='bill')billLoad();
  if(view=='admin')admLoad();
}
(async function(){
  const b=await api('/api/billing/status');
  if(b.ok&&b.data){isAdmin=!!b.data.isAdmin;planLabel=b.data.status;signedIn=true}
  const lim=await api('/api/assistant/limits'); if(lim.ok)limits=lim.data;
  render(); loadConvos(); restoreChatState();
  const q=new URLSearchParams(location.search).get('billing');
  if(q=='success'||q=='cancelled'){setTimeout(()=>toast(q=='success'?'Payment successful — welcome!':'Checkout was cancelled. No charge was made.'),600);history.replaceState(null,'',location.pathname)}
})();

/* ---------- Upgrade modal (fires on 402 or daily-limit hit) ---------- */
const PLANS=[
  {id:'basic',name:'Basic',price:'$9/mo',ai:'20 AI requests/day',lead:'10 leads/day'},
  {id:'pro',name:'Pro',price:'$29/mo',ai:'100 AI requests/day',lead:'50 leads/day'},
  {id:'proplus',name:'Pro+',price:'$59/mo',ai:'300 AI requests/day',lead:'200 leads/day'},
  {id:'lifetime',name:'Lifetime',price:'$1,999 once',ai:'300 AI requests/day, forever',lead:'200 leads/day'},
];
function showUpgrade(plan,reason){
  if(document.getElementById('upModal'))return;
  const cur=PLANS.findIndex(p=>p.id===plan);
  const next=cur>=0&&cur<PLANS.length-1?PLANS[cur+1]:PLANS[PLANS.length-1];
  const title=reason==='inactive'?'Your plan is not active':'You hit your daily AI limit';
  const sub=reason==='inactive'
    ?'Pick a plan to unlock the assistant, funnels, and lead capture.'
    :`You used all ${limits.limit} of today's AI requests on ${PLANS[cur]?.name||'your plan'}. Upgrade for more, or wait until tomorrow.`;
  const m=document.createElement('div');m.id='upModal';
  m.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(4,6,12,.7);display:flex;align-items:center;justify-content:center;padding:16px';
  m.innerHTML=`<div style="background:#0D1322;border:1px solid #19E6B4;border-radius:18px;max-width:520px;width:100%;padding:24px;color:#E8EBF3">
    <h2 style="margin:0 0 6px;font-size:22px">${title}</h2>
    <p style="margin:0 0 18px;color:#9AA3B5;font-size:14px">${sub}</p>
    <div style="border:1px solid #19E6B4;border-radius:12px;padding:14px 16px;margin-bottom:12px;background:rgba(25,230,180,.06)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <strong style="font-size:16px">${next.name}</strong><span style="color:#19E6B4;font-weight:700">${next.price}</span>
      </div>
      <div style="font-size:13px;color:#9AA3B5">${next.ai} · ${next.lead}</div>
      <button onclick="goBill()" style="margin-top:12px;width:100%;background:#19E6B4;border:0;color:#0B0F1A;border-radius:999px;padding:11px;font-weight:800;font-size:15px;cursor:pointer">Upgrade to ${next.name}</button>
    </div>
    <button onclick="goBill()" style="width:100%;background:none;border:1px solid rgba(255,255,255,.15);color:#E8EBF3;border-radius:999px;padding:10px;font-weight:600;cursor:pointer">Compare all plans</button>
    <button onclick="document.getElementById('upModal').remove()" style="width:100%;background:none;border:0;color:#8a93a6;padding:10px;cursor:pointer;font-size:13px">Not now</button>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove()});
}
function goBill(){document.getElementById('upModal')?.remove();show('bill');billLoad();}

/* ---------- PWA: service worker + quiet install button (no popup) ---------- */
if('serviceWorker' in navigator){navigator.serviceWorker.register('/pwa/sw.js').catch(()=>{})}
let deferredPrompt=null;
function isIos(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showPwaBtn()});
function showPwaBtn(){if(isStandalone())return;if(!deferredPrompt&&!isIos())return;const b=document.getElementById('pwaBtn');if(b)b.style.display=''}
async function pwaInstall(){
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;const b=document.getElementById('pwaBtn');if(b)b.style.display='none'}
  else if(isIos())alert('To install AIU: tap Share, then "Add to Home Screen".')
}
if(isIos()&&!isStandalone())window.addEventListener('load',()=>setTimeout(showPwaBtn,1500));
</script></body></html>
