<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AIU: Amp It Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/pwa/manifest.json">
<meta name="theme-color" content="#0d1114">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIU">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* AIU — Deep Teal Minimal */
:root{--ink:#0d1114;--panel:#14191d;--panel2:#1b2126;--line:#272e35;--paper:#e9edf0;--white:#fff;
--volt:#2dd4bf;--volt2:#7dd3fc;--lime:#2dd4bf;--blaze:#7dd3fc;--stone:#8b949e;--txt:#e9edf0;--danger:#FF6B6B;--amber:#fbbf24;
--focus-ring:0 0 0 3px rgba(45,212,191,.15)}
*,*:before,*:after{box-sizing:border-box}html,body{margin:0;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--ink);color:var(--txt);font:500 15px/1.6 'Inter',system-ui,sans-serif;display:flex;-webkit-font-smoothing:antialiased}
::selection{background:rgba(45,212,191,.28)}
.side{width:236px;background:#0a0e11;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;flex:none}
.logo{font:800 26px/1.05 'Inter',system-ui,sans-serif;padding:6px 10px 14px;color:#fff;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--volt)}
.nav{background:none;border:0;color:var(--stone);text-align:left;padding:9px 12px;border-radius:10px;font:500 14px 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s,color .15s}
.nav:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.nav.on{color:var(--txt);background:rgba(45,212,191,.12)}
.side .foot{margin-top:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--stone);border:1px solid var(--line)}
main{flex:1;overflow:auto;padding:28px;min-width:0;max-width:1040px;margin:0 auto;width:100%}
h1{font:700 clamp(28px,4vw,42px)/1.1 'Inter',system-ui,sans-serif;margin:0 0 6px;color:#fff;letter-spacing:-.02em}
h1 i{font-style:normal;color:var(--volt)}
h2{color:#fff;margin:0 0 10px;letter-spacing:-.01em;font-weight:650;font-size:21px}
.sub{color:var(--stone);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--stone);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--txt);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--volt);box-shadow:var(--focus-ring)}
input::placeholder,textarea::placeholder{color:#5b636c}
.btn{border:1px solid var(--volt);background:var(--volt);color:#04211d;border-radius:999px;padding:10px 20px;font:600 14px 'Inter',sans-serif;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--txt);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--stone)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#04211d}
.btn.danger{background:none;border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mono{font-family:'JetBrains Mono',monospace}
.stat{font:700 40px/1 'Inter',system-ui,sans-serif;color:#fff;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
pre{white-space:pre-wrap;background:#0a0e11;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 'JetBrains Mono',monospace;margin:8px 0;color:var(--txt);overflow:auto}
/* chat */
#chatlog{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.qopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qopt{background:transparent;border:1px dashed var(--lime);color:var(--lime);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.qopt:active{transform:scale(.97)}
.qopts.used{opacity:.4;pointer-events:none}
.msg{max-width:820px;padding:11px 15px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;line-height:1.6}
.msg.user{align-self:flex-end;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:transparent;border:0;padding-left:2px;max-width:100%}
.msg.sys{align-self:center;background:none;border:1px dashed var(--line);color:var(--stone);font-size:13px}
.msg pre{margin:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 16px;font:600 13px 'Inter',sans-serif;cursor:pointer;transition:border-color .15s}
.chip:hover{border-color:var(--volt)}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:linear-gradient(transparent,var(--ink) 32%);padding:14px 0 10px}
.composer textarea{flex:1;resize:none;max-height:140px;border-radius:16px;padding:13px 16px}
#artifact{margin-bottom:14px}
#artifact iframe{width:100%;height:480px;border:1px solid var(--line);border-radius:12px;background:#fff}
.atabs{display:flex;gap:6px;margin:10px 0}
.atabs button{border:1px solid var(--line);background:none;color:var(--stone);border-radius:999px;padding:5px 14px;font:600 13px 'Inter';cursor:pointer}
.atabs button.on{background:var(--volt);border-color:var(--volt);color:#04211d}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:6px}
.dot.off{background:var(--stone)}
a{color:var(--volt2)}
.fade>*{animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.fade>*{animation:none}}
@media(max-width:800px){body{flex-direction:column}.side{width:100%;flex-direction:row;overflow-x:auto;padding:10px;align-items:center}.logo{padding:0 10px;font-size:22px}.nav{white-space:nowrap;padding:8px 12px}.side .foot .pill,.side .foot #pwaBtn{display:none}.side .foot{display:flex;flex-direction:row;padding:0}main{padding:16px}.composer{position:static;background:none}}
.newchat{display:block;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font:600 14px 'Inter';cursor:pointer;margin:2px 0 10px;text-align:left;transition:border-color .15s}
.newchat:hover{border-color:var(--volt)}
.convolist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:60px;margin-bottom:8px}
.conv{background:none;border:0;color:var(--stone);text-align:left;padding:8px 12px;border-radius:8px;font:500 13px 'Inter';cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.conv.on{color:var(--txt);background:rgba(45,212,191,.1)}
.workcard{border-color:var(--volt)!important}
.worksteps{display:grid;gap:6px;margin-top:10px}
.workstep{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--stone);line-height:1.45}
.pluswrap{position:relative}
.plusmenu{position:absolute;bottom:calc(100% + 8px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:2px;min-width:230px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:60}
.plusmenu button{background:none;border:0;color:var(--txt);text-align:left;padding:10px 12px;border-radius:8px;font:500 14px 'Inter';cursor:pointer;display:flex;gap:10px;align-items:center}
.plusmenu button:hover{background:rgba(255,255,255,.06)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:660px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin:8px 0}
.preset-av{width:60px;height:60px;border-radius:50%;cursor:pointer;border:2px solid transparent;object-fit:cover;display:block}
.preset-av.on{border-color:var(--volt)}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.preset-btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 14px;font:600 13px 'Inter';cursor:pointer}
.preset-btn:hover{border-color:var(--volt)}
.setsec{margin-bottom:20px}
.setsec>h3{margin:0 0 8px;font-size:15px}
.secnav{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
#mnav{display:none}
@media(max-width:800px){
  #mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:200;background:#0a0e11;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #mnav button{flex:1;background:none;border:0;color:var(--stone);font:600 11px 'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
  #mnav button span{font-size:19px}
  #mnav button.on{color:var(--volt)}
  main{padding-bottom:78px}
  .side .secnav,.convolist{display:none}
}
</style></head><body>
<nav class="side" id="side"></nav><main id="main"></main>
<nav id="mnav"><button data-v="home" onclick="goHome()"><span>🏠</span>Home</button><button data-v="chat" onclick="setView('chat')"><span>💬</span>Chat</button><button data-v="aff" onclick="setView('aff')"><span>💸</span>Affiliates</button><button data-v="voice" onclick="openVoicePanel()"><span>🎙️</span>Voice</button><button data-v="setup" onclick="openSettings()"><span>⚙️</span>Setup</button></nav>
<div id="presence" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;display:none;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 18px 8px 8px;box-shadow:0 4px 24px rgba(0,0,0,.4);cursor:move;touch-action:none;user-select:none"><div id="presenceAvatar" style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none"><svg width="36" height="36" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#14191d"/><path d="M10 33 L24 11 L38 33" stroke="#2dd4bf" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="36" r="3.2" fill="#2dd4bf"/></svg></div><div><div id="presenceName" style="font-weight:700;font-size:14px">Assistant</div><div id="presenceStatus" style="font-size:12px;color:var(--stone)">Ready</div></div><div id="presenceDot" style="width:10px;height:10px;border-radius:50%;background:#22c55e"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(n||0).toLocaleString();
const usd=c=>'$'+(c/100).toFixed(2);
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))}}
function cp(t){try{navigator.clipboard.writeText(t);toast('Copied')}catch(e){prompt('Copy:',t)}}
function toast(t){const d=document.createElement('div');d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B2440;border:1px solid rgba(255,255,255,.15);color:#e9edf0;padding:10px 20px;border-radius:999px;font-size:14px;z-index:99';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

let view='chat', isAdmin=false, planLabel='basic', signedIn=false;
let msgs=[], chatId=null, convos=[];
let artifact=null; // {name, code}
let limits={plan:'basic',limit:20,used:0};
const dshort=t=>{try{return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}catch(e){return''}};

function renderSide(){
  const cl=(convos||[]).slice(0,60);
  const SEC=[['home','🏠','Home'],['chat','💬','Chat'],['funnels','🎯','Funnels & Leads'],['videos','🎬','Videos'],['studio','🎨','Studio'],['tools','🧰','AI Tools'],['aff','💸','Affiliates']];
  const secHtml='<div class="secnav">'+SEC.map(([v,ic,l])=>{
    const on=(v=='home'&&view=='chat'&&!chatId)||(v=='chat'&&view=='chat'&&!!chatId)||view==v;
    return `<button class="nav ${on?'on':''}" onclick="${v=='home'?'goHome()':`setView('${v}')`}">${ic} ${l}</button>`;
  }).join('')+'</div>';
  $('#side').innerHTML='<div class="logo" style="display:flex;align-items:center;gap:10px"><svg width="34" height="34" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#14191d" stroke="#272e35" stroke-width="1.5"/><path d="M10 33 L24 11 L38 33" stroke="#2dd4bf" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="36" r="3.2" fill="#2dd4bf"/></svg><span>AI<i>U</i></span></div>'+
    '<button class="newchat" onclick="newChat()">+ New chat</button>'+
    secHtml+
    '<div class="convolist">'+(cl.map(c=>`<button class="conv ${c.id==chatId?'on':''}" onclick="openConvo(${c.id})" title="${esc(c.title||'')}">${esc(c.title||'New chat')}</button>`).join('')||'<div style="color:var(--stone);font-size:13px;padding:8px 12px">No chats yet.</div>')+'</div>'+
    `<div class="foot"><span class="pill">${limits.limit<0?'AI: unlimited':`AI: ${limits.used}/${limits.limit} today`}</span><button class="nav" id="pwaBtn" style="display:none;border:1px solid var(--lime);color:var(--lime)" onclick="pwaInstall()">Install app</button><button class="nav" onclick="openSettings()">\u2699\uFE0F Assistant setup</button><button class="nav" onclick="setView('bill')">Billing</button>${isAdmin?`<button class="nav" onclick="setView('admin')">Admin</button>`:''}<button class="nav" onclick="out()">Sign out</button></div>`;
  showPwaBtn();
}
const VIEWS=['chat','funnels','videos','studio','tools','aff','bill','admin'];
function setView(v){view=VIEWS.includes(v)?v:'chat';artifactTab='preview';render();try{window.scrollTo(0,0)}catch(e){}}
function goHome(){newChat()}
async function out(){chatId=null;msgs=[];artifact=null;try{Object.keys(localStorage).filter(k=>k.indexOf('aiu_')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}await api('/api/auth/sign-out',{});location.href='/'}
/* Keep the current chat across tab switches and app backgrounding: remember chatId for 30 min. */
const CHAT_GRACE_MS=30*60*1000;
function saveChatState(){try{if(chatId)localStorage.setItem('aiu_chat',JSON.stringify({chatId,at:Date.now()}));else localStorage.removeItem('aiu_chat')}catch(e){}}
function restoreChatState(){try{const s=JSON.parse(localStorage.getItem('aiu_chat')||'null');if(s&&s.chatId&&Date.now()-s.at<CHAT_GRACE_MS){openConvo(s.chatId)}}catch(e){}}
setInterval(saveChatState,15000);
window.addEventListener('pagehide',saveChatState);

/* ---------- chat ---------- */
const CHIPS=['Build a lead funnel for my business','Make a spokesperson video ad','Create an image for my ad','Show my new leads'];
function mdInline(s){
  // s is already HTML-escaped. Inline markdown: `code`, **bold**, *italic*,
  // [label](url), bare URLs (clickable), ## headings, - bullets.
  const codes=[];
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>{codes.push(c);return '\u0001'+(codes.length-1)+'\u0002'});
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--volt2)">$1</a>');
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g,(m,p,u)=>{const tr=u.match(/[.,;:!?]+$/);const tail=tr?tr[0]:'';const url=tail?u.slice(0,-tail.length):u;return p+'<a href="'+url+'" target="_blank" rel="noopener" style="color:var(--volt2)">'+url+'</a>'+tail});
  s=s.replace(/^#{1,4}\s+(.+)$/gm,'<b>$1</b>');
  s=s.replace(/^-\s+/gm,'• ');
  s=s.replace(/\u0001(\d+)\u0002/g,(m,i)=>'<code style="background:#0a0e11;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font:13px \'JetBrains Mono\',monospace">'+codes[+i]+'</code>');
  return s.replace(/\n/g,'<br>');
}
/* ---------- Quick-reply options: [[OPTIONS]] block → tappable pills ---------- */
function parseOptions(t){
  const m=String(t||'').match(/\[\[OPTIONS\]\]\s*\n([\s\S]*?)\n\s*\[\[\/OPTIONS\]\]/);
  if(!m)return [];
  return m[1].split('\n').map(s=>s.trim()).filter(Boolean).slice(0,4);
}
function stripOptions(t){return String(t||'').replace(/\[\[OPTIONS\]\]\s*\n[\s\S]*?\n\s*\[\[\/OPTIONS\]\]/,'').trim()}
function tapOption(i,j){
  const m=msgs[i];if(!m||m.optionsUsed||agentRunning)return;
  const opts=parseOptions(m.content);const txt=opts[j];if(!txt)return;
  m.optionsUsed=true;render();sendChat(txt);
}
function fmtBody(t){
  // code fences -> <pre>, inline markdown elsewhere
  const parts=String(t).split(/```(\w*)\n?([\s\S]*?)```/g);
  let h='';
  for(let i=0;i<parts.length;i+=3){
    h+=mdInline(esc(parts[i]));
    if(i+2<parts.length) h+=`<pre>${esc(parts[i+2])}</pre>`;
  }
  return h;
}
function welcomeHtml(){
  if((convos||[]).length) return '<div class="msg sys">Say hello — try one of the suggestions above.</div>';
  const hr=new Date().getHours(); const dg=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  return `<div class="msg ai"><b>${dg} — I'm ${esc(ASSISTANT_NAME)}, your right hand in here.</b><br><br>Tell me what you want in plain words and I'll get it done while you watch: a <b>lead funnel</b> that captures customers, a <b>spokesperson video ad</b>, <b>images</b> for your marketing, a <b>website or app</b> — or ask about your plan, leads, and referrals.<br><br>Tap a suggestion to see what I can do.</div>`;
}
async function maybeRitual(){
  try{
    if(!ASSISTANT_PERSONALITY.ritualEnabled) return;
    if(chatId||msgs.length) return;
    const today=new Date().toLocaleDateString('en-CA');
    if(localStorage.getItem('aiu_ritualDay')===today) return;
    localStorage.setItem('aiu_ritualDay',today);
    const r=await api('/api/assistant/ritual',{date:today,hour:new Date().getHours()});
    if(r.ok&&r.data&&r.data.text){if(!chatId&&!msgs.length){msgs.push({role:'assistant',content:r.data.text});if(view=='chat')render()}}
    else{try{localStorage.removeItem('aiu_ritualDay')}catch(e){}}
  }catch(e){try{localStorage.removeItem('aiu_ritualDay')}catch(_){}}
}
function vChat(){
  return `<div class="fade" style="display:flex;flex-direction:column;min-height:calc(100vh - 60px)">
  <div class="chips">${CHIPS.map(c=>`<button class="chip" onclick="sendChat('${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('')}</div>
  <div id="chatlog" style="flex:1">${msgs.map((m,i)=>{const opts=(m.role=='assistant'&&!m.optionsUsed)?parseOptions(m.content):[];const pills=opts.length?`<div class="qopts${m.optionsUsed?' used':''}">${opts.map((o,j)=>`<button class="qopt" onclick="tapOption(${i},${j})">${esc(o)}</button>`).join('')}</div>`:'';return `<div class="msg ${m.role=='user'?'user':'ai'}">${m.role=='assistant'?`<button onclick="speakMsg(${i},this)" title="Listen" style="float:right;background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;opacity:.7">\uD83D\uDD0A</button>`:''}${fmtBody(stripOptions(m.content))}${pills}</div>`}).join('')||welcomeHtml()}</div>
  <div id="artifact"></div>
  <div class="composer pluswrap"><button class="btn ghost" id="plusBtn" onclick="togglePlus(event)" title="Quick actions" style="border-radius:14px;padding:10px 14px;flex:none">+</button><div class="plusmenu" id="plusMenu" style="display:none"><button onclick="quickAct('Build a lead funnel for my business')">\uD83C\uDFAF Build a funnel</button><button onclick="quickAct('Make a spokesperson video ad for my business')">\uD83C\uDFAC Make a video ad</button><button onclick="quickAct('Create an AI image for my marketing: ')">\uD83C\uDFA8 Create an image</button><button onclick="quickAct('Create a voiceover for this script: ')">\uD83C\uDF99\uFE0F Voiceover</button><button onclick="quickAct('Show my new leads')">\uD83D\uDC65 Show my leads</button><button onclick="quickAct('What is my affiliate referral link?')">\uD83D\uDD17 Referral link</button></div><textarea id="cin" rows="2" placeholder="Ask anything, or tell me what to build..." onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea><button class="btn ghost" onclick="openVoicePanel()" title="Voice — make your assistant sound like you" style="border-radius:14px;padding:10px 13px;flex:none">🎙️</button><button class="btn" id="csend" onclick="sendChat()">Send</button></div>
  </div>`;
}

function dlArtifact(){if(!artifact)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([artifact.code],{type:'text/html'}));a.download=(artifact.name||'project').toLowerCase().replace(/\W+/g,'-').slice(0,60)+'.html';a.click()}
function stripArtifact(t){return String(t).replace(/```html-artifact\s*\n[\s\S]*?```/g,'').trim()}
async function sendChat(prefill){
  if(agentRunning)return;
  const inp=document.getElementById('cin');
  const text=(prefill||(inp?inp.value:'')).trim();
  if(!text)return;
  if(inp)inp.value='';
  document.getElementById('plusMenu').style.display='none';
  msgs.push({role:'user',content:text});
  const log=document.getElementById('chatlog');
  log.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(text).replace(/\n/g,'<br>')}</div><div class="msg ai workcard" id="workcard"><b>\u2699\uFE0F Working on it…</b><div class="worksteps" id="worksteps"></div></div>`);
  log.scrollTop=log.scrollHeight;
  const sendBtn=document.getElementById('csend'); if(sendBtn)sendBtn.disabled=true;
  setPresenceStatus('Working…',true);
  agentRunning=true; agentAbort=new AbortController();
  const stepsEl=document.getElementById('worksteps');
  let cur=null, stepCount=0;
  const addStep=(txt,st)=>{
    stepCount++;
    const d=document.createElement('div');d.className='workstep';
    d.innerHTML=`<span>${st=='done'?'\u2705':st=='work'?'\u23F3':'\u25AB\uFE0F'}</span><span>${esc(txt)}</span>`;
    stepsEl.appendChild(d);log.scrollTop=log.scrollHeight;return d;
  };
  let finalText='', newConvId=null, errMsg='';
  try{
    const r=await fetch('/api/assistant/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:text,conversationId:chatId}),signal:agentAbort.signal});
    if(r.status===429){const j=await r.json().catch(()=>({}));errMsg=j.error||'Daily AI limit reached.';showUpgrade(j);}
    else if(!r.ok){errMsg='Something went wrong. Try again.'}
    else{
      const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
      const flush=()=>{
        let i;while((i=buf.indexOf('\n\n'))>=0){
          const chunk=buf.slice(0,i);buf=buf.slice(i+2);
          for(const line of chunk.split('\n')){
            if(!line.startsWith('data:'))continue;
            try{
              const e=JSON.parse(line.slice(5));
              if(e.type=='step'){if(cur)cur.querySelector('span:first-child').textContent='\u2705';cur=addStep(e.text,'work')}
              else if(e.type=='tool'){cur=addStep(e.text,'work')}
              else if(e.type=='tool_done'){if(cur)cur.querySelector('span:first-child').textContent='\u2705'}
              else if(e.type=='done'){if(cur)cur.querySelector('span:first-child').textContent='\u2705';finalText=String(e.text||'');if(e.conversationId)newConvId=e.conversationId}
              else if(e.type=='error'){errMsg=e.text||'The agent hit a problem.'}
            }catch{}
          }
        }
      };
      while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});flush()}
      flush();
    }
  }catch(err){ if(!errMsg) errMsg='Agent failed. Try again.'; }
  agentRunning=false;agentAbort=null;
  if(sendBtn)sendBtn.disabled=false;
  setPresenceStatus('Ready',false);
  const wc=document.getElementById('workcard');
  if(errMsg){
    if(wc)wc.remove();
    msgs.push({role:'assistant',content:errMsg});
  }else{
    if(newConvId){chatId=newConvId;saveChatState()}
    let reply=finalText||'Done.';
    const ma=reply.match(/```html-artifact\s*\n([\s\S]*?)```/);
    if(ma){artifact={name:text.slice(0,48)||'project',code:ma[1].trim()};reply=stripArtifact(reply)||'Done — your project is ready in the preview panel below.';}
    // collapse the working card into a summary
    if(wc)wc.innerHTML=`<span style="color:var(--stone);font-size:13px">\u2705 Done${stepCount?` · ${stepCount} step${stepCount>1?'s':''}`:''}</span>`;
    msgs.push({role:'assistant',content:reply});
    loadConvos();
  }
  render();
  const l2=document.getElementById('chatlog'); if(l2)l2.scrollTop=l2.scrollHeight;
  const lim=await api('/api/assistant/limits'); if(lim.ok){limits=lim.data;renderSide()}
}

function subMoney(cents,cur){return (cur||'USD')+' $'+(cents/100).toFixed(2).replace(/\.00$/,'')}
function subsHtml(){
  if(!SUBS.length)return '<p class="sub">No subscriptions tracked yet. Add every AI tool you pay for below — never get surprised by a renewal again.</p>';
  const total=SUBS.filter(s=>s.status==='active').reduce((a,s)=>a+(s.billingCycle==='monthly'?(s.costCents||0):s.billingCycle==='yearly'?(s.costCents||0)/12:0),0);
  const rows=SUBS.map(s=>{
    const warn=s.urgent?'<span class="pill" style="border-color:#fbbf24;color:#fbbf24">Renews soon</span>':s.daysUntil!=null?`<span class="pill">${s.daysUntil}d</span>`:'';
    const cyc=s.billingCycle==='trial'?'Trial':s.billingCycle;
    return `<div class="card" style="margin-bottom:8px"><div class="row" style="justify-content:space-between;align-items:center"><b>${s.serviceName}</b>${warn}</div><p class="sub">${s.planName||''} · ${cyc} · ${subMoney(s.costCents,s.currency)}${s.status!=='active'?' · '+s.status:''}</p><div class="row" style="gap:8px;margin-top:6px">${s.cancelUrl?`<a class="btn" href="${s.cancelUrl}" target="_blank">Cancel page</a>`:''}${s.status==='active'?`<button class="btn" onclick="subCancel(${s.id})">Mark canceled</button>`:''}<button class="btn" onclick="subDel(${s.id})">Remove</button></div></div>`;
  }).join('');
  return `<p class="sub" style="margin-bottom:10px">Active monthly spend: <b style="color:var(--txt)">${subMoney(Math.round(total),'USD')}/mo</b></p>${rows}`;
}
async function subAdd(){const n=document.getElementById('subName');if(!n.value.trim()){toast('Name the service.');return}const r=await api('/api/ai-subscriptions',{serviceName:n.value,planName:document.getElementById('subPlan').value,costCents:Math.round(parseFloat(document.getElementById('subCost').value||'0')*100),billingCycle:document.getElementById('subCycle').value,renewalDate:document.getElementById('subRenew').value||null,cancelUrl:document.getElementById('subCancel').value,notes:document.getElementById('subNotes').value});if(r.ok){toast('Tracked!');subsLoad();['subName','subPlan','subCost','subRenew','subCancel','subNotes'].forEach(id=>document.getElementById(id).value='')}else toast(r.data.error||'Could not add.')}
async function subCancel(id){const r=await api('/api/ai-subscriptions/'+id+'/cancel',{},'POST');if(r.ok)subsLoad()}
async function subDel(id){if(!confirm('Remove this subscription?'))return;const r=await api('/api/ai-subscriptions/'+id,null,'DELETE');if(r.ok)subsLoad()}
function affJoin(){return `<div class="card"><b>Join free</b><p style="color:var(--stone)">Get your personal referral link in one tap. Anyone who buys through it is tracked for 60 days. You start at <b>15% commission</b> — refer more and your rate climbs, up to 50% for life.</p><div style="display:grid;gap:8px;margin-top:10px"><input id="affPhone" placeholder="Phone (for payouts)" style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt)"><input id="affAddr" placeholder="Mailing address (for payouts)" style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt)"></div><div class="row" style="margin-top:10px"><button class="btn lime" onclick="affDoJoin()">Get my referral link</button></div></div>`+affPartnerCard()}
async function affDoJoin(){const r=await api('/api/affiliates/join',{phone:document.getElementById('affPhone')?.value||'',address:document.getElementById('affAddr')?.value||''});if(r.ok)affLoad();else toast(r.data.error||'Could not join.')}
function affDash(A){const a=A.affiliate,s=A.stats;
  const tierPill=a.tier=='partner'
    ?'<span class="pill" style="border-color:var(--lime);color:var(--lime)">PARTNER · 40%</span>'
    :a.elite?'<span class="pill" style="border-color:var(--lime);color:var(--lime)">ELITE · 50% FOR LIFE</span>'
    :`<span class="pill">${Math.round(a.rate*100)}% rate</span>`;
  const ladder=A.tiers.map(t=>{const cur=a.tier!='partner'&&!a.elite&&Math.abs(a.rate-t.rate)<0.001;
    return `<div class="row" style="padding:6px 0;border-top:1px solid var(--line);justify-content:space-between"><span>${esc(t.label)}</span><b class="mono"${cur?' style="color:var(--lime)"':''}>${Math.round(t.rate*100)}%</b></div>`}).join('');
  const next=A.nextTier?`<p class="sub" style="margin:8px 0 0">Refer <b class="mono">${usd(A.nextTier.atCents-s.revenueCents)}</b> more to unlock <b>${Math.round(A.nextTier.rate*100)}%</b>.</p>`:'';
  const ft=A.fastTrack&&!A.fastTrack.qualified
    ?`<div class="card" style="border:1px solid var(--lime)"><b>⚡ Fast track — 50% for life</b><p style="color:var(--stone)">Refer <b class="mono">${usd(A.fastTrack.targetCents)}</b> in your first 90 days — <b>${A.fastTrack.daysLeft} days</b> left, you're at <b class="mono">${usd(A.fastTrack.revenueCents)}</b>, <b>${A.fastTrack.spotsLeft} of 5</b> spots left — and you lock <b>50% for life</b>. Or climb the ladder to $50k referred: first 15 lock it in (<b>${A.ladderSpotsLeft} of 15</b> spots left).</p></div>`:'';
  const ideaCard=a.tier=='partner'
    ?`<div class="card"><b>Pitch an idea</b><p style="color:var(--stone)">Partners get a direct line. Ideas you share become part of AIU — submitting one doesn't grant ownership or rights in the business.</p><div style="margin-top:10px"><input id="ideaTitle" placeholder="Idea title" maxlength="120" style="margin-bottom:8px"><textarea id="ideaBody" placeholder="Describe it..." maxlength="2000" style="min-height:80px"></textarea></div><div class="row" style="margin-top:10px"><button class="btn lime" onclick="sendIdea()">Send idea</button></div></div>`:'';
  return `<div class="card"><b>Your referral link ${tierPill}</b>
  <div class="row" style="margin-top:10px"><input readonly value="${esc(a.link)}" onclick="this.select()" style="flex:1;min-width:200px"><button class="btn lime" onclick="cp('${esc(a.link)}')">Copy link</button></div>
  <p class="sub" style="margin:8px 0 0">Anyone who buys through your link is tracked for 60 days.</p></div>
  <div class="grid"><div class="card"><label>Referrals</label><div class="stat mono">${s.referrals}</div></div><div class="card"><label>Earned</label><div class="stat mono">${usd(s.earnedCents)}</div></div><div class="card"><label>Paid out</label><div class="stat mono">${usd(s.paidCents)}</div></div></div>
  ${ft}
  <div class="card"><b>Commission tiers</b><div style="margin-top:6px">${ladder}</div>${next}</div>
  ${ideaCard}
  ${a.tier=='partner'?'':affPartnerCard()}
  ${A.recent.length?`<div class="card"><b>Recent referrals</b>${A.recent.map(r=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line);justify-content:space-between"><span class="pill">${esc(r.kind)}</span><span class="mono">${usd(r.commissionCents)}</span><span class="pill">${esc(r.payoutStatus)}</span></div>`).join('')}</div>`:''}`}
function affPartnerCard(){return `<div class="card" style="border:1px solid var(--lime)"><b>Become a Partner — $4,999/year</b><p style="color:var(--stone)">Partners earn <b>40% commission</b> from day one, get early access to new features, and a direct line to pitch ideas for the app. Ideas you share become part of AIU; all business rights stay with the owner.</p><div class="row" style="margin-top:10px"><button class="btn lime" onclick="buyPartner()">Become a partner</button></div></div>`}

async function admSet(id,status){await fetch('/api/admin/leads/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});admLoad()}
async function refPay(id){await fetch('/api/admin/referrals/'+id+'/pay',{method:'POST'});admLoad()}
async function affStatus(id,status){await fetch('/api/admin/affiliates/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});admLoad()}
async function affElite(id,elite){await fetch('/api/admin/affiliates/'+id+'/elite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({elite})});admLoad()}
async function subRefund(userId){
  if(!confirm('Refund this subscriber\'s most recent payment? This sends money back via Stripe.'))return;
  const r=await(await fetch('/api/admin/subscribers/'+encodeURIComponent(userId)+'/refund',{method:'POST'})).json();
  toast(r.ok?`Refunded ${(r.amount/100).toFixed(2)} ${r.currency.toUpperCase()}`:(r.error||'Refund failed'));admLoad();
}
async function subCharge(userId){
  const amt=prompt('Amount to charge (USD, e.g. 29.00):');
  if(!amt)return;
  const cents=Math.round(parseFloat(amt)*100);
  if(!cents||cents<50){toast('Enter an amount of at least $0.50.');return}
  const desc=prompt('Description (optional):')||'Manual charge';
  if(!confirm(`Charge $${(cents/100).toFixed(2)} to this subscriber's card on file?`))return;
  const r=await(await fetch('/api/admin/subscribers/'+encodeURIComponent(userId)+'/charge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amountCents:cents,description:desc})})).json();
  toast(r.ok?`Charged $${(cents/100).toFixed(2)} (${r.status})`:(r.error||'Charge failed'));admLoad();
}
async function ideaStatus(id,status){await fetch('/api/admin/ideas/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});admLoad()}

  await api('/api/settings',{assistantName:document.getElementById('pName').value.trim()||'Assistant',personality:document.getElementById('pPersonality').value,character:'',filter:document.getElementById('pFilter').value,voiceProvider:vp,voice:v});
  ASSISTANT_PERSONALITY.voiceProvider=vp;ASSISTANT_PERSONALITY.voice=v;
  speakText(`Hey, I'm ${name}. This is what I sound like.`,document.querySelector('[onclick="previewVoice()"]'));

async function uploadAvatar(){const f=document.getElementById('avatarFile').files[0];if(!f){toast('Choose an image first.');return}if(f.size>2*1024*1024){toast('Image must be under 2MB.');return}const fd=new FormData();fd.append('avatar',f);toast('Uploading...');const r=await fetch('/api/settings/avatar',{method:'POST',body:fd,credentials:'include'});const j=await r.json().catch(()=>({}));if(r.ok){ASSISTANT_PERSONALITY.hasAvatar=true;updatePresence();fillPersonality();toast('Avatar updated!')}else toast(j.error||'Upload failed.')}
async function removeAvatar(){const r=await api('/api/settings/avatar',null,'DELETE');if(r.ok){ASSISTANT_PERSONALITY.hasAvatar=false;updatePresence();fillPersonality();toast('Avatar removed.')}}
function updatePresence(){
  const p=document.getElementById('presence');if(!p)return;
  p.style.display=signedIn?'flex':'none';
  document.getElementById('presenceName').textContent=ASSISTANT_NAME;
  const av=document.getElementById('presenceAvatar');

  restorePresencePos();
}
/* Draggable presence bar — position saved per user */
function restorePresencePos(){
  try{
    const pos=JSON.parse(localStorage.getItem('presencePos')||'null');
    const p=document.getElementById('presence');if(!p||!pos)return;
    p.style.left=pos.x+'px';p.style.top=pos.y+'px';p.style.transform='none';
  }catch(e){}
}
(function(){
  const p=document.getElementById('presence');if(!p)return;
  let sx=0,sy=0,ox=0,oy=0,dragging=false;
  p.addEventListener('pointerdown',e=>{
    // Don't start drag on text selection or button taps
    if(e.target.closest('button'))return;
    dragging=true;sx=e.clientX;sy=e.clientY;
    const r=p.getBoundingClientRect();ox=r.left;oy=r.top;
    p.style.transform='none';p.style.left=ox+'px';p.style.top=oy+'px';
    p.setPointerCapture(e.pointerId);
  });
  p.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const nx=Math.max(0,Math.min(window.innerWidth-p.offsetWidth,ox+e.clientX-sx));
    const ny=Math.max(0,Math.min(window.innerHeight-p.offsetHeight,oy+e.clientY-sy));
    p.style.left=nx+'px';p.style.top=ny+'px';
  });
  const end=e=>{
    if(!dragging)return;dragging=false;
    try{localStorage.setItem('presencePos',JSON.stringify({x:parseInt(p.style.left),y:parseInt(p.style.top)}))}catch(_){}
  };
  p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end);
})();
function setPresenceStatus(text,working){
  const s=document.getElementById('presenceStatus'),d=document.getElementById('presenceDot');
  if(s)s.textContent=text;
  if(d){d.style.background=working?'#2dd4bf':'#22c55e';d.style.animation=working?'pulse 1s infinite':''}
}
async function renameAssistant(){
  const n=prompt('Name your personal assistant:',ASSISTANT_NAME);
  if(!n||!n.trim())return;
  const r=await api('/api/settings',{assistantName:n.trim()});
  if(r.ok){ASSISTANT_NAME=r.data.assistantName;updatePresence();render();toast('Your assistant is now called '+ASSISTANT_NAME)}
  else toast(r.data.error||'Could not save the name.')
}

        <strong style="font-size:16px">${next.name}</strong><span style="color:#2dd4bf;font-weight:700">${next.price}</span>
      </div>
      <div style="font-size:13px;color:#9AA3B5">${next.ai} · ${next.lead}</div>
      <button onclick="goBill()" style="margin-top:12px;width:100%;background:#2dd4bf;border:0;color:#04211d;border-radius:999px;padding:11px;font-weight:800;font-size:15px;cursor:pointer">Upgrade to ${next.name}</button>
    </div>

/* ---------- PWA: service worker + quiet install button (no popup) ---------- */
if('serviceWorker' in navigator){navigator.serviceWorker.register('/pwa/sw.js').catch(()=>{})}
let deferredPrompt=null;
function isIos(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showPwaBtn()});
function showPwaBtn(){if(isStandalone())return;if(!deferredPrompt&&!isIos())return;const b=document.getElementById('pwaBtn');if(b)b.style.display=''}
async function pwaInstall(){
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;const b=document.getElementById('pwaBtn');if(b)b.style.display='none'}
  else if(isIos())alert('To install AIU: tap Share, then "Add to Home Screen".')
}
if(isIos()&&!isStandalone())window.addEventListener('load',()=>setTimeout(showPwaBtn,1500));
