<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AIU: Amp It Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/pwa/manifest.json">
<meta name="theme-color" content="#071016">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIU">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#071016;--panel:#161c22;--panel2:#222c35;--line:#38434e;--paper:#edf4f6;--white:#fff;
--volt:#ff4f33;--volt2:#ff7a5e;--lime:#ff4f33;--blaze:#ff4f33;--stone:#93a3ad;--txt:#edf4f6;--danger:#FF6B6B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--txt);font:500 15px/1.55 'Inter',system-ui,sans-serif;display:flex}
.side{width:248px;background:#0a141a;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;flex:none}
.logo{font:800 32px/1.05 'Inter',system-ui,sans-serif;padding:4px 10px 16px;color:#fff}
.logo i{font-style:normal;color:var(--volt2)}
.nav{background:none;border:0;color:var(--stone);text-align:left;padding:10px 14px;border-radius:12px;font:600 15px 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.nav.on{color:#fff;background:rgba(91,140,255,.16)}
.side .foot{margin-top:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--stone);border:1px solid var(--line)}
main{flex:1;overflow:auto;padding:26px;min-width:0;max-width:1080px;margin:0 auto;width:100%}
h1{font:800 clamp(34px,5vw,54px)/1.05 'Inter',system-ui,sans-serif;margin:0 0 6px;color:#fff;letter-spacing:-.03em}
h1 i{font-style:normal;color:var(--volt2)}
h2{color:#fff;margin:0 0 10px;letter-spacing:-.02em}
.sub{color:var(--stone);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--stone);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--volt);outline-offset:1px}
.btn{border:1px solid var(--volt);background:var(--volt);color:#fff;border-radius:999px;padding:10px 20px;font:600 14px 'Inter',sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--txt);border-color:var(--line)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#fff}
.btn.danger{background:none;border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mono{font-family:'JetBrains Mono',monospace}
.stat{font:800 46px/1 'Inter',system-ui,sans-serif;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
pre{white-space:pre-wrap;background:#0a141a;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 'JetBrains Mono',monospace;margin:8px 0;color:var(--txt);overflow:auto}
/* chat */
#chatlog{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.msg{max-width:860px;padding:12px 16px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--volt);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;border:1px dashed var(--line);color:var(--stone);font-size:13px}
.msg pre{margin:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 16px;font:600 13px 'Inter',sans-serif;cursor:pointer}
.chip:hover{border-color:var(--volt)}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--ink);padding:10px 0}
.composer textarea{flex:1;resize:none;max-height:140px}
#artifact{margin-bottom:14px}
#artifact iframe{width:100%;height:480px;border:1px solid var(--line);border-radius:10px;background:#fff}
.atabs{display:flex;gap:6px;margin:10px 0}
.atabs button{border:1px solid var(--line);background:none;color:var(--stone);border-radius:999px;padding:5px 14px;font:600 13px 'Inter';cursor:pointer}
.atabs button.on{background:var(--volt);border-color:var(--volt);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:6px}
.dot.off{background:var(--stone)}
a{color:var(--volt2)}
.fade>*{animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.fade>*{animation:none}}
@media(max-width:800px){body{flex-direction:column}.side{width:100%;flex-direction:row;overflow-x:auto;padding:10px;align-items:center}.logo{padding:0 10px;font-size:24px}.nav{white-space:nowrap;padding:8px 12px}.side .foot .pill,.side .foot #pwaBtn{display:none}.side .foot{display:flex;flex-direction:row;padding:0}main{padding:16px}.composer{position:static}}
</style></head><body>
<nav class="side" id="side"></nav><main id="main"></main>
<div id="presence" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;display:none;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 18px 8px 8px;box-shadow:0 4px 24px rgba(0,0,0,.4);cursor:move;touch-action:none;user-select:none"><div id="presenceAvatar" style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none"><svg width="36" height="36" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#161c22"/><path d="M10 33 L24 11 L38 33" stroke="#ff4f33" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="36" r="3.2" fill="#ff4f33"/></svg></div><div><div id="presenceName" style="font-weight:700;font-size:14px">Assistant</div><div id="presenceStatus" style="font-size:12px;color:var(--stone)">Ready</div></div><div id="presenceDot" style="width:10px;height:10px;border-radius:50%;background:#22c55e"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(n||0).toLocaleString();
const usd=c=>'$'+(c/100).toFixed(2);
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))}}
function cp(t){try{navigator.clipboard.writeText(t);toast('Copied')}catch(e){prompt('Copy:',t)}}
function toast(t){const d=document.createElement('div');d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B2440;border:1px solid rgba(255,255,255,.15);color:#edf4f6;padding:10px 20px;border-radius:999px;font-size:14px;z-index:99';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

let view='assist', isAdmin=false, planLabel='basic', signedIn=false;
let msgs=[], chatId=null, convos=[];
let artifact=null; // {name, code}
let limits={plan:'basic',limit:20,used:0};
const dshort=t=>{try{return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}catch(e){return''}};

const NAV=[
 ['assist','Assistant',"This is your right hand. Tell it what you need — funnels, copy, answers, ideas. It learns how you work and gets sharper every time you talk to it. I built it to be the assistant I always wished I had."],
 ['funnels','Funnels & Leads',"This is where money gets made. Build pages that capture leads, then work those leads. Every business needs this — I built mine on it."],
 ['videos','Videos',"Spokesperson videos without touching a camera. Type your script, pick your format, done. Made for ads."],
 ['studio','Studio',"Your creative shop. Images, voiceovers, background removal — plus the clipper that turns long videos into short viral clips."],
 ['tools','AI Tools',"Every AI in one place. Connect your keys, unlock premium voices and AI search. Track every subscription so nothing ever sneaks up on you again."],
 ['aff','Affiliates',"Get paid to spread the word. Share your link, earn commission on every signup. This is how we all eat."],
];
const NAV_ADMIN=['admin','Admin',"The command center. Your numbers, your people, your business — everything in one view."];
function founderTip(id,ev){ev.stopPropagation();const d=NAV.concat([NAV_ADMIN]).find(n=>n[0]==id);if(!d)return;let t=document.getElementById('founderTip');if(t){t.remove();if(t.dataset.for==id)return}
 t=document.createElement('div');t.id='founderTip';t.dataset.for=id;
 t.style.cssText='position:fixed;z-index:200;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.5);display:flex;gap:12px;align-items:flex-start';
 t.innerHTML=`<img src="/founder.jpg" style="width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--lime)"><div><b style="font-size:13px">Javier — founder</b><p class="sub" style="margin:4px 0 0;font-size:13px;line-height:1.45">${d[2]}</p></div>`;
 document.body.appendChild(t);
 const r=ev.target.getBoundingClientRect();let x=Math.min(window.innerWidth-320,Math.max(10,r.left));let y=r.bottom+8;if(y+160>window.innerHeight)y=Math.max(10,r.top-170);
 t.style.left=x+'px';t.style.top=y+'px';
 setTimeout(()=>{const c=e=>{if(!t.contains(e.target)){t.remove();document.removeEventListener('click',c)}};document.addEventListener('click',c)},10);
}
function renderSide(){
  $('#side').innerHTML='<div class="logo" style="display:flex;align-items:center;gap:10px"><svg width="36" height="36" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#161c22" stroke="#38434e" stroke-width="1.5"/><path d="M10 33 L24 11 L38 33" stroke="#ff4f33" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="36" r="3.2" fill="#ff4f33"/></svg><span>AI<i>U</i></span></div>'+
    NAV.concat(isAdmin?[NAV_ADMIN]:[]).map(n=>`<button class="nav ${n[0]==view?'on':''}" onclick="setView('${n[0]}')" style="display:flex;align-items:center;gap:8px"><img src="/founder.jpg" onclick="founderTip('${n[0]}',event)" title="What is this?" style="width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;cursor:help;border:1px solid var(--line)"><span>${n[1]}</span>${n[0]=='funnels'&&newLeadCount()>0?` <span class="pill" style="border-color:var(--lime);color:var(--lime)">${newLeadCount()} new</span>`:''}</button>`).join('')+
    `<div class="foot"><span class="pill">${limits.limit<0?'AI: unlimited':`AI: ${limits.used}/${limits.limit} today`}</span><button class="nav" id="pwaBtn" style="display:none;border:1px solid var(--lime);color:var(--lime)" onclick="pwaInstall()">Install app</button><button class="nav" onclick="setView('bill')">Billing</button><button class="nav" onclick="out()">Sign out</button></div>`;
  showPwaBtn();
}
function setView(v){view=v;artifactTab='preview';if(v=='assist'){loadConvos()}render()}
async function out(){await api('/api/auth/sign-out',{});try{localStorage.removeItem('aiu_chat')}catch(e){}location.href='/'}
/* Keep the current chat across tab switches and app backgrounding: remember chatId for 30 min. */
const CHAT_GRACE_MS=30*60*1000;
function saveChatState(){try{if(chatId)localStorage.setItem('aiu_chat',JSON.stringify({chatId,at:Date.now()}));else localStorage.removeItem('aiu_chat')}catch(e){}}
function restoreChatState(){try{const s=JSON.parse(localStorage.getItem('aiu_chat')||'null');if(s&&s.chatId&&Date.now()-s.at<CHAT_GRACE_MS){openConvo(s.chatId)}}catch(e){}}
setInterval(saveChatState,15000);
window.addEventListener('pagehide',saveChatState);

/* ---------- chat ---------- */
const CHIPS=['Build me a funnel for roofers','Show my new leads','Build a landing page for my business','What is my plan?'];
function fmtBody(t){
  // code fences -> <pre>, then line breaks
  const parts=String(t).split(/```(\w*)\n?([\s\S]*?)```/g);
  let h='';
  for(let i=0;i<parts.length;i+=3){
    h+=esc(parts[i]).replace(/\n/g,'<br>');
    if(i+2<parts.length) h+=`<pre>${esc(parts[i+2])}</pre>`;
  }
  return h;
}
function welcomeHtml(){
  if(convos.length) return '<div class="msg sys">Say hello — try one of the suggestions above.</div>';
  return `<div class="msg ai"><b>Hey — I'm ${esc(ASSISTANT_NAME)}, your right hand in here.</b><br><br>Tell me what you want in plain words and I'll get it done: a <b>lead funnel</b> that captures customers, a <b>website or app</b> for your business — or ask me anything about your plan, leads, and referrals.<br><br>Flip on <b>Agent mode</b> above if you want to watch me work through something step by step. Tap a suggestion to see what I can do.</div>`;
}
function vAssist(){
  return `<div class="fade"><h1>${esc(ASSISTANT_NAME)}</h1>
  <p class="sub">Your personal AI — chat, build funnels that generate leads, create websites and apps, manage leads.</p>
  <div class="card" style="border-color:var(--lime)"><b>🎭 Personality</b><p class="sub">Make ${esc(ASSISTANT_NAME)} yours — name, face, voice, and attitude.</p>
  <div style="display:grid;gap:10px;margin-top:10px">
    <div class="row" style="gap:12px;align-items:center">
      <img id="avatarPrev" src="/api/settings/avatar/img" onerror="this.style.display='none'" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--lime)">
      <div style="display:grid;gap:6px;flex:1">
        <div class="row" style="gap:8px"><input type="file" id="avatarFile" accept="image/*" style="flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--txt);font-size:12px"><button class="btn" onclick="uploadAvatar()">Upload</button></div>
        <button class="btn ghost" style="font-size:12px" onclick="removeAvatar()">Remove custom avatar</button>
      </div>
    </div>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <input id="pName" placeholder="Name (e.g. Deadpool)" maxlength="30" style="flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt)">
      <input id="pChar" placeholder="Talk like... (e.g. Deadpool, Tony Stark)" maxlength="100" style="flex:2;min-width:180px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt)">
    </div>
    <textarea id="pPersonality" placeholder="Describe how you want your AI to be... (e.g. 'A sarcastic genius who roasts my bad ideas but always helps me win. Treats me like a friend, not a customer.')" maxlength="2000" style="min-height:70px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt)"></textarea>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap">
      <span class="sub">Voice:</span>
      <select id="pVoiceProvider" onchange="voiceProviderChanged()" style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt)"><option value="openai">Stock voices</option><option value="elevenlabs">ElevenLabs</option></select>
      <select id="pVoice" style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt)"><option value="alloy">Alloy</option><option value="echo">Echo</option><option value="fable">Fable</option><option value="onyx">Onyx</option><option value="nova">Nova</option><option value="shimmer">Shimmer</option></select>
      <select id="pElVoice" style="display:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt)"><option value="">Loading voices…</option></select>
      <button class="btn ghost" onclick="previewVoice()">🔊 Preview voice</button>
    </div>
    <div id="cloneBox" style="display:none;border:1px dashed var(--line);border-radius:10px;padding:12px">
      <div class="sub" style="margin-bottom:8px"><b>Clone a voice</b> — upload 1–3 clear audio clips of the voice you want (30+ seconds each, no background noise). Use a voice you have the right to clone.</div>
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
        <input id="cloneName" placeholder="Voice name (e.g. Ryan-style)" maxlength="60" style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt);min-width:160px">
        <input id="cloneFiles" type="file" accept="audio/*" multiple style="color:var(--muted)">
        <button class="btn ghost" onclick="cloneVoice()">🎙 Clone voice</button>
      </div>
      <div id="cloneStatus" class="sub"></div>
    </div>
    <div class="row" style="gap:8px;align-items:center">
      <span class="sub">Tone:</span>
      <select id="pFilter" style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt)"><option value="clean">Clean</option><option value="raw">Raw / unfiltered</option></select>
      <button class="btn lime" onclick="savePersonality()">Save personality</button>
    </div>
    <p class="sub" style="font-size:11px">Raw lets it swear, roast, and talk freely — like a real person with no filter. It still won't do hate, harassment, or harm. Ever.</p>
  </div></div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn ${assistMode=='chat'?'lime':'ghost'}" onclick="setAssistMode('chat')">Chat</button>
    <button class="btn ${assistMode=='agent'?'lime':'ghost'}" onclick="setAssistMode('agent')">Agent mode</button>
    ${assistMode=='chat'?`<button class="btn ghost" onclick="newChat()">+ New chat</button>
    <select id="convosel" onchange="openConvo(this.value)" style="flex:1;min-width:160px;max-width:440px"><option value="">Past conversations…</option>${convos.map(c=>`<option value="${c.id}"${c.id==chatId?' selected':''}>${esc(c.title)} · ${esc(dshort(c.updatedAt))}</option>`).join('')}</select>
    ${chatId?`<button class="btn danger" onclick="delConvo()">Delete</button>`:''}`:''}
  </div>
  ${assistMode=='chat'?`
  <div class="chips">${CHIPS.map(c=>`<button class="chip" onclick="sendChat('${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('')}</div>
  <div id="chatlog">${msgs.map((m,i)=>`<div class="msg ${m.role=='user'?'user':'ai'}">${m.role=='assistant'?`<button onclick="speakMsg(${i},this)" title="Listen" style="float:right;background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;opacity:.7">🔊</button>`:''}${fmtBody(m.content)}</div>`).join('')||welcomeHtml()}</div>
  <div id="artifact"></div>
  <div class="composer"><textarea id="cin" rows="2" placeholder="Ask anything, or tell me what to build..." onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea><button class="btn" id="csend" onclick="sendChat()">Send</button></div>
  `:`
  <div class="card" style="border-color:var(--lime)">
    <b>Agent mode</b>
    <p style="color:var(--stone);font-size:14px;margin:6px 0 12px">Give the agent a goal and watch it work through it step by step — like watching an assistant check things off a list. Try: "Build a funnel for my roofing business and publish it" or "Check my new leads and claim the best one".</p>
    <div class="composer"><textarea id="agentIn" rows="2" placeholder="What should the agent get done?"></textarea><button class="btn lime" id="agentGo" onclick="runAgent()">Run</button></div>
  </div>
  <div id="agentSteps" style="display:grid;gap:8px;margin-top:12px"></div>
  <div id="agentDone"></div>
  `}
  </div>`;
}
let assistMode='chat';
function setAssistMode(m){assistMode=m;render()}
/* ---------- Agent mode: watch the AI work step by step ---------- */
let agentRunning=false;
let agentAbort=null;
function stopAgent(){if(agentAbort){agentAbort.abort();agentAbort=null}agentRunning=false;const g=document.getElementById('agentGo');if(g){g.textContent='Run';g.onclick=runAgent;g.classList.add('lime');g.classList.remove('danger')}setPresenceStatus('Ready',false);toast('You took over — agent stopped.')}
async function runAgent(){
  if(agentRunning)return;
  const goal=(document.getElementById('agentIn')?.value||'').trim();
  if(!goal){toast('Tell the agent what to get done.');return}
  agentRunning=true;
  agentAbort=new AbortController();
  const stepsEl=document.getElementById('agentSteps'),doneEl=document.getElementById('agentDone');
  stepsEl.innerHTML='';doneEl.innerHTML='';
  const goBtn=document.getElementById('agentGo');
  goBtn.textContent='Take over ⏹';goBtn.onclick=stopAgent;goBtn.classList.remove('lime');goBtn.classList.add('danger');
  setPresenceStatus('Working on: '+goal.slice(0,40),true);
  const addStep=(text,state)=>{
    const d=document.createElement('div');
    d.className='card';d.style.cssText='padding:10px 14px;display:flex;gap:10px;align-items:center';
    d.innerHTML=`<span style="font-size:18px">${state=='done'?'✅':state=='work'?'⏳':'▫️'}</span><span>${esc(text)}</span>`;
    stepsEl.appendChild(d);return d;
  };
  let cur=null;
  try{
    const r=await fetch('/api/assistant/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal}),signal:agentAbort.signal});
    if(r.status===429){const j=await r.json().catch(()=>({}));showUpgrade(j);throw new Error(j.error||'Daily AI limit reached.')}
    if(!r.ok)throw new Error('Agent request failed.');
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    const flush=()=>{
      let i;while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        for(const line of chunk.split('\n')){
          if(!line.startsWith('data:'))continue;
          try{
            const e=JSON.parse(line.slice(5));
            if(e.type=='step'){if(cur)cur.querySelector('span:first-child').textContent='✅';cur=addStep(e.text,'work')}
            else if(e.type=='tool'){cur=addStep(e.text,'work')}
            else if(e.type=='tool_done'){if(cur)cur.querySelector('span:first-child').textContent='✅'}
            else if(e.type=='done'){if(cur)cur.querySelector('span:first-child').textContent='✅';lastAgentGoal=goal;doneEl.innerHTML=`<div class="card" style="border-color:var(--lime);margin-top:12px"><b>Done</b><p style="white-space:pre-wrap">${esc(e.text)}</p>${isAdmin?'<button class="btn ghost" onclick="copyPaxHandoff()">Copy handoff for Pax</button>':''}</div>`}
            else if(e.type=='error'){toast(e.text)}
          }catch{}
        }
      }
    };
    while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});flush()}
    flush();
  }catch(err){if(err.message!=='Agent request failed.'&&!String(err.message).includes('Daily'))toast(err.message||'Agent failed.')}
  agentRunning=false;agentAbort=null;const g=document.getElementById('agentGo');if(g){g.textContent='Run';g.onclick=runAgent;g.classList.add('lime');g.classList.remove('danger')}setPresenceStatus('Ready',false);
}

async function sendChat(prefill){
  const inp=$('#cin'); const text=(prefill||(inp?inp.value:'')).trim(); if(!text) return;
  if(inp) inp.value='';
  msgs.push({role:'user',content:text}); render();

  const log=$('#chatlog'); log.insertAdjacentHTML('beforeend','<div class="msg ai" id="thinking">Thinking…</div>'); log.scrollTop=log.scrollHeight;
  $('#csend').disabled=true;
  const r=await api('/api/assistant/chat',{message:text,conversationId:chatId,artifact});
  $('#thinking')?.remove(); $('#csend').disabled=false; setPresenceStatus('Ready',false);
  if(r.status==402){msgs.push({role:'assistant',content:'Your subscription is not active.'});showUpgrade(null,'inactive');}
  else if(r.status==429&&r.data.limitHit){msgs.push({role:'assistant',content:r.data.error||'Daily limit reached.'});showUpgrade(r.data.plan,r.data.limit);}
  else if(!r.ok){msgs.push({role:'assistant',content:r.data.error||'Something went wrong. Try again.'});}
  else{
    chatId=r.data.conversationId||chatId;
    saveChatState();
    let reply=String(r.data.reply||'');
    const m=reply.match(/```html-artifact\s*\n([\s\S]*?)```/);
    if(m){artifact={name:text.slice(0,48)||'project',code:m[1].trim()};reply=stripArtifact(reply)||'Done — your project is ready in the preview panel below.';}
    msgs.push({role:'assistant',content:reply});

  }
  render();
  const l2=$('#chatlog'); if(l2) l2.scrollTop=l2.scrollHeight;
  const lim=await api('/api/assistant/limits'); if(lim.ok){limits=lim.data;renderSide()}
}

async function clipLoad(){try{const r=await api('/api/content/jobs');if(r.ok){CLIPJOBS=r.data||[];const d=document.getElementById('clipJobs');if(d)d.innerHTML=CLIPJOBS.slice(0,10).map(j=>{const st={uploaded:'Uploaded',transcribing:'Transcribing audio...',analyzing:'Finding highlights...',clipping:'Cutting clips...',done:'Done',failed:'Failed'}[j.status]||j.status;const clips=(j.clips||[]).map(c=>{const mm=String(Math.floor((c.end-c.start)/60)).padStart(1,'0'),ss=String(Math.floor((c.end-c.start)%60)).padStart(2,'0');return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line);justify-content:space-between;align-items:center"><div><b style="font-size:14px">${esc(c.title)}</b><div class="mono" style="font-size:12px;color:var(--stone)">${mm}:${ss}</div></div>${j.isVideo?`<video src="${c.url}" controls style="max-width:180px;border-radius:8px"></video>`:`<audio src="${c.url}" controls style="max-width:180px"></audio>`}<a class="btn ghost" style="padding:6px 14px;font-size:13px" href="${c.url}" download>Download</a></div>`}).join('');const hls=(j.highlights||[]).map(h=>`<span class="pill" style="margin:2px" title="${esc(h.summary)}">${esc(h.title)}</span>`).join('');return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px"><div class="row" style="justify-content:space-between"><b>${esc(j.title)}</b><span class="pill">${st}</span></div>${j.status==='failed'?`<p style="color:var(--danger);font-size:13px">${esc(j.error||'Failed')}</p>`:''}${hls?`<div style="margin-top:6px">${hls}</div>`:''}${clips}</div>`}).join('')||'<p style="color:var(--stone);font-size:13px">No clips yet.</p>'}}catch(e){}}
async function studioBg(){const u=document.getElementById('stBgUrl');if(!u.value.trim()){toast('Paste an image URL first.');return}toast('Removing background...');const r=await api('/api/studio/bgremove',{imageUrl:u.value});if(r.ok){u.value='';studioLoad()}else toast(r.data.error||'Background removal failed.')}

    const badge=s.connected?'<span class="pill" style="border-color:var(--lime);color:var(--lime)">Connected</span>':'<span class="pill">Not connected</span>';
    const tools=(s.tools||[]).map(t=>`<span class="pill" style="font-size:11px">${t}</span>`).join(' ');

function subMoney(cents,cur){return (cur||'USD')+' $'+(cents/100).toFixed(2).replace(/\.00$/,'')}
function subsHtml(){
  if(!SUBS.length)return '<p class="sub">No subscriptions tracked yet. Add every AI tool you pay for below — never get surprised by a renewal again.</p>';
  const total=SUBS.filter(s=>s.status==='active').reduce((a,s)=>a+(s.billingCycle==='monthly'?(s.costCents||0):s.billingCycle==='yearly'?(s.costCents||0)/12:0),0);
  const rows=SUBS.map(s=>{
    const warn=s.urgent?'<span class="pill" style="border-color:#ff4f33;color:#ff4f33">Renews soon</span>':s.daysUntil!=null?`<span class="pill">${s.daysUntil}d</span>`:'';
    const cyc=s.billingCycle==='trial'?'Trial':s.billingCycle;
    return `<div class="card" style="margin-bottom:8px"><div class="row" style="justify-content:space-between;align-items:center"><b>${s.serviceName}</b>${warn}</div><p class="sub">${s.planName||''} · ${cyc} · ${subMoney(s.costCents,s.currency)}${s.status!=='active'?' · '+s.status:''}</p><div class="row" style="gap:8px;margin-top:6px">${s.cancelUrl?`<a class="btn" href="${s.cancelUrl}" target="_blank">Cancel page</a>`:''}${s.status==='active'?`<button class="btn" onclick="subCancel(${s.id})">Mark canceled</button>`:''}<button class="btn" onclick="subDel(${s.id})">Remove</button></div></div>`;
  }).join('');
  return `<p class="sub" style="margin-bottom:10px">Active monthly spend: <b style="color:var(--txt)">${subMoney(Math.round(total),'USD')}/mo</b></p>${rows}`;

async function speakText(text,btn){
  try{
    // If already speaking, stop it (toggle off)
    if(speakingAudio){speakingAudio.pause();speakingAudio=null;document.querySelectorAll('#chatlog button[title="Listen"]').forEach(b=>b.textContent='🔊');const pv=document.querySelector('[onclick="previewVoice()"]');if(pv)pv.innerHTML='🔊 Preview voice';return}
    if(btn)btn.textContent='⏳';
    const r=await fetch('/api/assistant/speak',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({text})});
    if(!r.ok){const j=await r.json().catch(()=>({}));toast(j.error||'Voice failed.');if(btn)btn.textContent='🔊';return}
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    speakingAudio=new Audio(url);
    if(btn)btn.textContent='⏸';
    const done=()=>{speakingAudio=null;document.querySelectorAll('#chatlog button[title="Listen"]').forEach(b=>b.textContent='🔊');const pv=document.querySelector('[onclick="previewVoice()"]');if(pv)pv.innerHTML='🔊 Preview voice';URL.revokeObjectURL(url)};
    speakingAudio.onended=done;speakingAudio.onerror=done;
    speakingAudio.play();
  }catch(e){toast('Voice failed.');if(btn)btn.textContent='🔊'}
}

/* Draggable presence bar — position saved per user */
function restorePresencePos(){
  try{
    const pos=JSON.parse(localStorage.getItem('presencePos')||'null');
    const p=document.getElementById('presence');if(!p||!pos)return;
    p.style.left=pos.x+'px';p.style.top=pos.y+'px';p.style.transform='none';
  }catch(e){}
}
(function(){
  const p=document.getElementById('presence');if(!p)return;
  let sx=0,sy=0,ox=0,oy=0,dragging=false;
  p.addEventListener('pointerdown',e=>{
    // Don't start drag on text selection or button taps
    if(e.target.closest('button'))return;
    dragging=true;sx=e.clientX;sy=e.clientY;
    const r=p.getBoundingClientRect();ox=r.left;oy=r.top;
    p.style.transform='none';p.style.left=ox+'px';p.style.top=oy+'px';
    p.setPointerCapture(e.pointerId);
  });
  p.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const nx=Math.max(0,Math.min(window.innerWidth-p.offsetWidth,ox+e.clientX-sx));
    const ny=Math.max(0,Math.min(window.innerHeight-p.offsetHeight,oy+e.clientY-sy));
    p.style.left=nx+'px';p.style.top=ny+'px';
  });
  const end=e=>{
    if(!dragging)return;dragging=false;
    try{localStorage.setItem('presencePos',JSON.stringify({x:parseInt(p.style.left),y:parseInt(p.style.top)}))}catch(_){}
  };
  p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end);
})();

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showPwaBtn()});
function showPwaBtn(){if(isStandalone())return;if(!deferredPrompt&&!isIos())return;const b=document.getElementById('pwaBtn');if(b)b.style.display=''}
async function pwaInstall(){
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;const b=document.getElementById('pwaBtn');if(b)b.style.display='none'}
  else if(isIos())alert('To install AIU: tap Share, then "Add to Home Screen".')
}
if(isIos()&&!isStandalone())window.addEventListener('load',()=>setTimeout(showPwaBtn,1500));
</script></body></html>
